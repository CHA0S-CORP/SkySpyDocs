                - Callsign patterns (airline codes)

                Useful for understanding which routes are most common in your coverage area.
                
      summary: Get frequent routes and city pairs
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: 'Maximum number of routes to return (default: 20)'
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/geographic/:
    get:
      operationId: api_v1_stats_geographic_retrieve
      description: |2-

                Returns comprehensive geographic and origin statistics including:
                - Countries of origin breakdown (from registration prefixes)
                - Airlines/operators frequency
                - Airports most connected to coverage area
                - Military vs civilian breakdown by country
                
      summary: Get all geographic statistics
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: refresh
          schema:
            type: boolean
            default: false
          description: Force refresh from database instead of using cache
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/geographic/airports/:
    get:
      operationId: api_v1_stats_geographic_airports_retrieve
      description: |2-

                Returns airports most connected to the coverage area.

                Based on ACARS message mentions and decoded origin/destination data.
                Includes airport name, country, and type when available.
                
      summary: Get airport connectivity
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: 'Maximum number of airports to return (default: 20)'
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/geographic/countries/:
    get:
      operationId: api_v1_stats_geographic_countries_retrieve
      description: |2-

                Returns breakdown of aircraft by country of origin.

                Country is determined from registration prefix (e.g., N = USA, G- = UK).
                Includes military percentage for each country.
                
      summary: Get countries of origin breakdown
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
          description: 'Maximum number of countries to return (default: 25)'
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/geographic/locations/:
    get:
      operationId: api_v1_stats_geographic_locations_retrieve
      description: |2-

                Returns most connected cities/locations based on aircraft registration data.
                This is an alias for the airports endpoint for API compatibility.
                
      summary: Get connected locations
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: 'Maximum number of locations to return (default: 20)'
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/geographic/military-breakdown/:
    get:
      operationId: api_v1_stats_geographic_military_breakdown_retrieve
      description: |2-

                Returns breakdown of military vs civilian aircraft by country.

                Shows counts and percentages for each country based on
                aircraft registration and session is_military flag.
                
      summary: Get military vs civilian breakdown
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/geographic/operators/:
    get:
      operationId: api_v1_stats_geographic_operators_retrieve
      description: |2-

                Returns breakdown of aircraft by operator/airline.

                Shows aircraft count per operator from AircraftInfo database.
                
      summary: Get operators/airlines frequency
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
          description: 'Maximum number of operators to return (default: 25)'
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/geographic/summary/:
    get:
      operationId: api_v1_stats_geographic_summary_retrieve
      description: |2-

                Returns a summary of geographic statistics.
                Provides key metrics for dashboard overview.
                
      summary: Get geographic stats summary
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/tracking-quality/:
    get:
      operationId: api_v1_stats_tracking_quality_retrieve
      description: |2-

                Get session tracking quality statistics including:
                - Average position update rate per aircraft (positions per minute)
                - Session completeness scores (% of expected positions received)
                - Quality grade distribution (excellent, good, fair, poor)
                - Top and worst quality sessions
                
      summary: Get tracking quality stats
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
          description: 'Time range in hours (default: 24)'
        - in: query
          name: refresh
          schema:
            type: boolean
          description: Force cache refresh
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/tracking-quality/gaps/:
    get:
      operationId: api_v1_stats_tracking_quality_gaps_retrieve
      description: |2-

                Analyze coverage gaps in tracking sessions.

                Returns detailed information about periods where aircraft were not
                receiving position updates, including:
                - Gap duration distribution
                - Sessions with worst coverage gaps
                - Average and maximum gap times
                
      summary: Get coverage gaps analysis
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
          description: 'Time range in hours (default: 24)'
        - in: query
          name: limit
          schema:
            type: integer
          description: 'Max sessions to analyze (default: 100)'
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/stats/tracking-quality/session/{icao_hex}/:
    get:
      operationId: api_v1_stats_tracking_quality_session_retrieve
      description: Get quality metrics for a specific aircraft session
      summary: Get session quality details
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
          description: 'Time range to search (default: 24)'
        - in: path
          name: icao_hex
          schema:
            type: string
          description: Aircraft ICAO hex
          required: true
      tags:
        - api
      responses:
        '200':
          description: No response body
  /api/v1/system/databases:
    get:
      operationId: api_v1_system_databases_retrieve
      description: >-
        Statistics about loaded external aircraft databases (ADSBX, tar1090,
        FAA, OpenSky)
      summary: External database stats
