components:
  schemas:
    APIKey:
      type: object
      description: Serializer for API keys.
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Descriptive name for this API key
          maxLength: 100
        key:
          type: string
          readOnly: true
        key_prefix:
          type: string
          readOnly: true
        scopes:
          description: Permission scopes for this key (empty = all user permissions)
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - id
        - key
        - key_prefix
        - last_used_at
        - name
        - user_id
    APIKeyCreate:
      type: object
      description: Serializer for creating API keys.
      properties:
        name:
          type: string
          maxLength: 100
        user_id:
          type: integer
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
        - name
    APIKeyCreateRequest:
      type: object
      description: Serializer for creating API keys.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        user_id:
          type: integer
        scopes:
          type: array
          items:
            type: string
            minLength: 1
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
        - name
    APIKeyRequest:
      type: object
      description: Serializer for API keys.
      properties:
        name:
          type: string
          minLength: 1
          description: Descriptive name for this API key
          maxLength: 100
        scopes:
          description: Permission scopes for this key (empty = all user permissions)
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
        - name
    AcarsAirlineActivity:
      type: object
      description: Statistics for airline ACARS activity.
      properties:
        airline_icao:
          type: string
          nullable: true
          description: Airline ICAO code
        airline_iata:
          type: string
          nullable: true
          description: Airline IATA code
        airline_name:
          type: string
          description: Airline name
        message_count:
          type: integer
          description: Total messages
        unique_flights:
          type: integer
          description: Unique flight callsigns
      required:
        - airline_iata
        - airline_icao
        - airline_name
        - message_count
        - unique_flights
    AcarsAirlineInfo:
      type: object
      description: Decoded airline information from callsign.
      properties:
        icao:
          type: string
          nullable: true
          description: Airline ICAO code (3 letters)
        iata:
          type: string
          nullable: true
          description: Airline IATA code (2 letters)
        name:
          type: string
          nullable: true
          description: Full airline name
        flight_number:
          type: string
          nullable: true
          description: Flight number portion of callsign
    AcarsAirlineStats:
      type: object
      description: ACARS statistics grouped by airline.
      properties:
        airlines:
          type: array
          items:
            $ref: '#/components/schemas/AcarsAirlineActivity'
          description: Airlines by activity
        total_with_airline_info:
          type: integer
          description: Messages with airline info
        total_messages:
          type: integer
          description: Total messages analyzed
        time_range_hours:
          type: integer
          description: Time range in hours
        timestamp:
          type: string
          description: Stats generation timestamp
      required:
        - airlines
        - time_range_hours
        - timestamp
        - total_messages
        - total_with_airline_info
    AcarsAirportMention:
      type: object
      description: Airport mentioned in messages.
      properties:
        airport:
          type: string
          description: Airport ICAO code
        count:
          type: integer
          description: Number of mentions
      required:
        - airport
        - count
    AcarsCategoryStats:
      type: object
      description: Statistics for a message category.
      properties:
        category:
          type: string
          description: Category identifier
        name:
          type: string
          description: Category name
        description:
          type: string
          description: Category description
        count:
          type: integer
          description: Number of messages
        percentage:
          type: number
          format: double
          description: Percentage of total messages
      required:
        - category
        - count
        - description
        - name
        - percentage
    AcarsCategoryTrends:
      type: object
      description: Message category distribution over time.
      properties:
        hourly_category_trends:
          type: array
          items:
            $ref: '#/components/schemas/AcarsHourlyCategoryTrend'
          description: Category breakdown by hour
        category_totals:
          type: object
          additionalProperties: {}
          description: Total count per category
        time_range_hours:
          type: integer
          description: Time range in hours
        timestamp:
          type: string
          description: Stats generation timestamp
      required:
        - category_totals
        - hourly_category_trends
        - time_range_hours
        - timestamp
    AcarsFreeTextAnalysis:
      type: object
      description: Free text message analysis results.
      properties:
        top_airports_mentioned:
          type: array
          items:
            $ref: '#/components/schemas/AcarsAirportMention'
          description: Most mentioned airports
        weather_content:
          type: object
          additionalProperties: {}
          description: Weather content breakdown
        message_patterns:
          type: object
          additionalProperties: {}
          description: Detected message patterns
        total_analyzed:
          type: integer
          description: Messages analyzed
        time_range_hours:
          type: integer
          description: Time range in hours
        timestamp:
          type: string
          description: Analysis timestamp
      required:
        - message_patterns
        - time_range_hours
        - timestamp
        - top_airports_mentioned
        - total_analyzed
        - weather_content
    AcarsFrequencyStats:
      type: object
      description: Statistics for a frequency.
      properties:
        frequency:
          type: number
          format: double
          description: Frequency in MHz
        frequency_mhz:
          type: string
          description: Formatted frequency string
        count:
          type: integer
          description: Number of messages
      required:
        - count
        - frequency
        - frequency_mhz
    AcarsHourlyCategoryTrend:
      type: object
      description: Category breakdown for an hour.
      properties:
        hour:
          type: integer
          description: Hour of day (0-23)
        categories:
          type: object
          additionalProperties: {}
          description: Category counts
        total:
          type: integer
          description: Total for hour
      required:
        - categories
        - hour
        - total
    AcarsHourlyCount:
      type: object
      description: Hourly message count.
      properties:
        hour:
          type: integer
          description: Hour of day (0-23)
        count:
          type: integer
          description: Message count
      required:
        - count
        - hour
    AcarsLabelInfo:
      type: object
      description: Decoded ACARS message label information.
      properties:
        name:
          type: string
          nullable: true
          description: Human-readable label name
        description:
          type: string
          nullable: true
          description: Detailed label description
    AcarsLabelStats:
      type: object
      description: Statistics for a single message label.
      properties:
        label:
          type: string
          description: Message label code
        count:
          type: integer
          description: Number of messages
        name:
          type: string
          description: Human-readable label name
        description:
          type: string
          description: Label description
        category:
          type: string
          description: Label category
      required:
        - category
        - count
        - description
        - label
        - name
    AcarsMessage:
      type: object
      description: Single ACARS/VDL2 message.
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        source:
          $ref: '#/components/schemas/AcarsMessageSourceEnum'
        channel:
          type: string
          nullable: true
          maxLength: 10
        frequency:
          type: number
          format: double
          nullable: true
        icao_hex:
          type: string
          nullable: true
          maxLength: 10
        registration:
          type: string
          nullable: true
          maxLength: 20
        callsign:
          type: string
          nullable: true
          maxLength: 10
        label:
          type: string
          nullable: true
          maxLength: 10
        block_id:
          type: string
          nullable: true
          maxLength: 5
        msg_num:
          type: string
          nullable: true
          maxLength: 10
        ack:
          type: string
          nullable: true
          maxLength: 5
        mode:
          type: string
          nullable: true
          maxLength: 5
        text:
          type: string
          nullable: true
        decoded:
          nullable: true
        decoded_text:
          nullable: true
          description: Decoded message text fields
        formatted_text:
          type: string
          nullable: true
          description: Human-readable formatted text
        signal_level:
          type: number
          format: double
          nullable: true
        error_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        station_id:
          type: string
          nullable: true
          maxLength: 50
        airline:
          allOf:
            - $ref: '#/components/schemas/AcarsAirlineInfo'
          nullable: true
          description: Decoded airline information
        label_info:
          allOf:
            - $ref: '#/components/schemas/AcarsLabelInfo'
          nullable: true
          description: Decoded label information
      required:
        - id
        - timestamp
    AcarsMessageSourceEnum:
      enum:
        - acars
        - vdlm2
      type: string
      description: |-
        * `acars` - ACARS
        * `vdlm2` - VDL Mode 2
    AcarsMessageStats:
      type: object
      description: Comprehensive ACARS message statistics.
      properties:
        total_messages:
          type: integer
          description: Total messages in time range
        time_range_hours:
          type: integer
          description: Time range in hours
        by_source:
          type: object
          additionalProperties: {}
          description: Count by source (ACARS/VDL2)
        by_label:
          type: array
          items:
            $ref: '#/components/schemas/AcarsLabelStats'
          description: Top labels by count
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/AcarsCategoryStats'
          description: Messages by category
        top_frequencies:
          type: array
          items:
            $ref: '#/components/schemas/AcarsFrequencyStats'
          description: Top frequencies
        messages_with_content:
          type: integer
          description: Messages with text content
        content_percentage:
          type: number
          format: double
          description: Percentage with content
        timestamp:
          type: string
          description: Stats generation timestamp
      required:
        - by_category
        - by_label
        - by_source
        - content_percentage
        - messages_with_content
        - time_range_hours
        - timestamp
        - top_frequencies
        - total_messages
    AcarsPeakInterval:
      type: object
      description: Peak activity interval.
      properties:
        timestamp:
          type: string
          nullable: true
          description: Peak interval timestamp
        count:
          type: integer
          description: Message count at peak
      required:
        - count
        - timestamp
    AcarsStats:
      type: object
      description: ACARS service statistics.
      properties:
        total_messages:
          type: integer
          description: Total messages in database
        last_hour:
          type: integer
          description: Messages in last hour
        last_24h:
          type: integer
          description: Messages in last 24 hours
        by_source:
          type: object
          additionalProperties: {}
          description: Count by source
        top_labels:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Most common labels
