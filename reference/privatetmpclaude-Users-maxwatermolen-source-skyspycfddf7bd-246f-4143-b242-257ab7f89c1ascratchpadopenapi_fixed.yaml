            Type of notification service

            * `discord` - Discord
            * `slack` - Slack
            * `pushover` - Pushover
            * `telegram` - Telegram
            * `email` - Email
            * `webhook` - Generic Webhook
            * `ntfy` - ntfy
            * `gotify` - Gotify
            * `home_assistant` - Home Assistant
            * `twilio` - Twilio SMS
            * `custom` - Custom Apprise URL
