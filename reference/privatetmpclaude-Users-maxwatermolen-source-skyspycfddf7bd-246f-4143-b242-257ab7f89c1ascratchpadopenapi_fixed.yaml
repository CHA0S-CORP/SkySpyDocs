    post:
      operationId: api_v1_admin_roles_create
      description: |-
        ViewSet for managing roles.

        Requires `roles.*` permissions.
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
          application/x-www-form-urlencoded:
            schema:
