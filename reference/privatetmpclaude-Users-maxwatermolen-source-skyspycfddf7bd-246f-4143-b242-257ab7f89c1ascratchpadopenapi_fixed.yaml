openapi: 3.0.3
info:
  title: SkysPy ADS-B Tracking API
  version: 2.6.0
  description: Real-time ADS-B aircraft tracking, ACARS messaging, and aviation data API
paths:
  /api/v1/acars/:
    get:
      operationId: api_v1_acars_list
      description: List ACARS messages.
      summary: List ACARS messages
      parameters:
        - in: query
          name: callsign
          schema:
            type: string
          description: Filter by callsign
        - in: query
          name: hours
          schema:
            type: integer
          description: Time range in hours
        - in: query
          name: icao_hex
          schema:
            type: string
          description: Filter by ICAO
        - in: query
          name: label
          schema:
            type: string
          description: Filter by label
        - in: query
          name: limit
          schema:
            type: integer
          description: Max results
        - name: offset
          required: false
          in: query
          description: The initial index from which to return the results.
          schema:
            type: integer
        - in: query
          name: source
          schema:
            type: string
          description: Filter by source
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcarsMessageList'
          description: ''
  /api/v1/acars/{id}/:
    get:
      operationId: api_v1_acars_retrieve
      description: ViewSet for ACARS/VDL2 messages.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this acars message.
          required: true
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsMessage'
          description: ''
  /api/v1/acars/labels/:
    get:
      operationId: api_v1_acars_labels_retrieve
      description: Get reference data for ACARS message labels
      summary: Get ACARS label reference
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsMessage'
          description: ''
  /api/v1/acars/stats/:
    get:
      operationId: api_v1_acars_stats_retrieve
      description: Get ACARS statistics.
      summary: Get ACARS statistics
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsStats'
          description: ''
  /api/v1/acars/stats/airlines/:
    get:
      operationId: api_v1_acars_stats_airlines_retrieve
      description: Statistics on ACARS activity grouped by airline/operator
      summary: Get ACARS airline activity statistics
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Maximum number of airlines to return
        - in: query
          name: use_cache
          schema:
            type: boolean
            default: true
          description: Use cached stats if available
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsAirlineStats'
          description: ''
  /api/v1/acars/stats/breakdown/:
    get:
      operationId: api_v1_acars_stats_breakdown_retrieve
      description: >-
        Detailed breakdown of ACARS messages by type, label, category, and
        source
      summary: Get ACARS message breakdown statistics
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: use_cache
          schema:
            type: boolean
            default: true
          description: Use cached stats if available
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsMessageStats'
          description: ''
  /api/v1/acars/stats/category-trends/:
    get:
      operationId: api_v1_acars_stats_category_trends_retrieve
      description: Message category distribution over time (hourly)
      summary: Get ACARS category trends
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsCategoryTrends'
          description: ''
  /api/v1/acars/stats/summary/:
    get:
      operationId: api_v1_acars_stats_summary_retrieve
      description: High-level summary of ACARS message statistics for dashboard
      summary: Get ACARS summary statistics
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsSummaryStats'
          description: ''
  /api/v1/acars/stats/text-analysis/:
    get:
      operationId: api_v1_acars_stats_text_analysis_retrieve
      description: Pattern analysis of message text content
      summary: Analyze ACARS free text content
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Maximum items per category
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsFreeTextAnalysis'
          description: ''
  /api/v1/acars/stats/trends/:
    get:
      operationId: api_v1_acars_stats_trends_retrieve
      description: Time-series data showing message activity over time
      summary: Get ACARS message trends
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
          description: 'Time range in hours (default: 24)'
        - in: query
          name: interval
          schema:
            type: string
            default: hour
          description: 'Time interval: hour or day'
        - in: query
          name: use_cache
          schema:
            type: boolean
            default: true
          description: Use cached stats if available
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsTrends'
          description: ''
  /api/v1/acars/status/:
    get:
      operationId: api_v1_acars_status_retrieve
      description: Get ACARS receiver status.
      summary: Get ACARS receiver status
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcarsStatus'
          description: ''
  /api/v1/admin/api-keys/:
    get:
      operationId: api_v1_admin_api_keys_list
      description: List all API keys.
      parameters:
        - name: limit
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - name: offset
          required: false
          in: query
          description: The initial index from which to return the results.
          schema:
            type: integer
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAPIKeyList'
          description: ''
    post:
      operationId: api_v1_admin_api_keys_create
      description: >-
        ViewSet for managing API keys.


        In admin context (/api/v1/admin/api-keys/), requires users.view
        permission.
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreate'
          description: ''
  /api/v1/admin/api-keys/{id}/:
    get:
      operationId: api_v1_admin_api_keys_retrieve
      description: >-
        ViewSet for managing API keys.


        In admin context (/api/v1/admin/api-keys/), requires users.view
        permission.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this api key.
          required: true
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
          description: ''
    put:
      operationId: api_v1_admin_api_keys_update
      description: >-
        ViewSet for managing API keys.


        In admin context (/api/v1/admin/api-keys/), requires users.view
        permission.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this api key.
          required: true
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
          description: ''
    patch:
      operationId: api_v1_admin_api_keys_partial_update
      description: >-
        ViewSet for managing API keys.


        In admin context (/api/v1/admin/api-keys/), requires users.view
        permission.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this api key.
          required: true
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAPIKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAPIKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAPIKeyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
          description: ''
    delete:
      operationId: api_v1_admin_api_keys_destroy
      description: Delete/revoke an API key - marks as inactive instead of deleting.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this api key.
          required: true
      tags:
        - api
      responses:
        '204':
          description: No response body
  /api/v1/admin/api-keys/{id}/regenerate/:
    post:
      operationId: api_v1_admin_api_keys_regenerate_create
      description: Regenerate an API key.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this api key.
          required: true
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
          description: ''
  /api/v1/admin/feature-access/:
    get:
      operationId: api_v1_admin_feature_access_list
      description: List all feature access configurations.
      parameters:
        - name: limit
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - name: offset
          required: false
          in: query
          description: The initial index from which to return the results.
          schema:
            type: integer
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeatureAccessList'
          description: ''
    post:
      operationId: api_v1_admin_feature_access_create
      description: |-
        ViewSet for managing feature access configuration.

        Requires admin permissions.
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureAccess'
          description: ''
  /api/v1/admin/feature-access/{feature}/:
    get:
      operationId: api_v1_admin_feature_access_retrieve
      description: |-
        ViewSet for managing feature access configuration.

        Requires admin permissions.
      parameters:
        - in: path
          name: feature
          schema:
            enum:
              - aircraft
              - alerts
              - safety
              - audio
              - acars
              - history
              - system
              - users
              - roles
            type: string
            description: |-
              * `aircraft` - Aircraft Tracking
              * `alerts` - Alert Rules
              * `safety` - Safety Events
              * `audio` - Audio Transmissions
              * `acars` - ACARS Messages
              * `history` - Flight History
              * `system` - System Status
              * `users` - User Management
              * `roles` - Role Management
          required: true
      tags:
        - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureAccess'
          description: ''
    put:
      operationId: api_v1_admin_feature_access_update
      description: |-
        ViewSet for managing feature access configuration.

        Requires admin permissions.
      parameters:
        - in: path
          name: feature
          schema:
            enum:
              - aircraft
              - alerts
              - safety
              - audio
              - acars
              - history
              - system
              - users
              - roles
            type: string
            description: |-
              * `aircraft` - Aircraft Tracking
              * `alerts` - Alert Rules
              * `safety` - Safety Events
              * `audio` - Audio Transmissions
              * `acars` - ACARS Messages
              * `history` - Flight History
              * `system` - System Status
              * `users` - User Management
              * `roles` - Role Management
          required: true
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureAccess'
          description: ''
    patch:
      operationId: api_v1_admin_feature_access_partial_update
      description: |-
        ViewSet for managing feature access configuration.

        Requires admin permissions.
      parameters:
        - in: path
          name: feature
          schema:
            enum:
              - aircraft
              - alerts
              - safety
              - audio
              - acars
              - history
              - system
              - users
              - roles
            type: string
            description: |-
              * `aircraft` - Aircraft Tracking
              * `alerts` - Alert Rules
              * `safety` - Safety Events
              * `audio` - Audio Transmissions
              * `acars` - ACARS Messages
              * `history` - Flight History
              * `system` - System Status
              * `users` - User Management
              * `roles` - Role Management
          required: true
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFeatureAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFeatureAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFeatureAccessRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureAccess'
          description: ''
    delete:
      operationId: api_v1_admin_feature_access_destroy
      description: |-
        ViewSet for managing feature access configuration.

        Requires admin permissions.
      parameters:
        - in: path
          name: feature
          schema:
            enum:
              - aircraft
              - alerts
              - safety
              - audio
              - acars
              - history
              - system
              - users
              - roles
            type: string
            description: |-
              * `aircraft` - Aircraft Tracking
              * `alerts` - Alert Rules
              * `safety` - Safety Events
              * `audio` - Audio Transmissions
              * `acars` - ACARS Messages
              * `history` - Flight History
              * `system` - System Status
              * `users` - User Management
              * `roles` - Role Management
          required: true
      tags:
        - api
      responses:
        '204':
          description: No response body
  /api/v1/admin/feature-access/initialize_defaults/:
    post:
      operationId: api_v1_admin_feature_access_initialize_defaults_create
      description: |-
        Initialize default feature access configuration.

        Creates FeatureAccess entries for all features with default settings.
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeatureAccessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureAccess'
          description: ''
  /api/v1/admin/oidc-mappings/:
